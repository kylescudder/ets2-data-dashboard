name: Release Windows client

# Builds apps/client into a single Windows .exe via `bun build --compile`
# and attaches it to a GitHub Release. Triggered by pushing a tag like
# `v0.1.0`, or run manually via the Actions tab.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.16

      - name: Install workspace deps
        run: bun install

      - name: Compile Windows exe
        run: bun run --filter @ets2/client build:exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/client/dist/ets2-tracker.exe
          generate_release_notes: true

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ets2-tracker
          path: apps/client/dist/ets2-tracker.exe
