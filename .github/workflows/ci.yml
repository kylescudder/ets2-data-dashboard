name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ets2
          POSTGRES_PASSWORD: ets2
          POSTGRES_DB: ets2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ets2:ets2@127.0.0.1:5432/ets2_test
      DATABASE_URL: postgres://ets2:ets2@127.0.0.1:5432/ets2_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run test
      - run: bun run build
      - run: bun run typecheck
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cabmate-browser-evidence
          path: |
            .artifacts/companion-merge/*.png
            .artifacts/companion-merge/playwright-report/
            test-results/
          retention-days: 7
