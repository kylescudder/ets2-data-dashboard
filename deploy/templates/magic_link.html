<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; background: #0b0f17; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e6e9ef; }
  .wrap { max-width: 560px; margin: 40px auto; background: #121826; border-radius: 12px; overflow: hidden; border: 1px solid #1f2a3d; }
  .hd { padding: 24px 32px; background: #0b0f17; color: #fbbf24; font-weight: 700; font-size: 18px; border-bottom: 1px solid #1f2a3d; letter-spacing: 0.02em; }
  .bd { padding: 32px; }
  h1 { margin: 0 0 16px; font-size: 22px; font-weight: 700; color: #e6e9ef; }
  p  { margin: 0 0 16px; line-height: 1.55; color: #a1a8b8; }
  .btn { display: inline-block; padding: 12px 22px; background: #fbbf24; color: #0b0f17 !important; text-decoration: none; border-radius: 8px; font-weight: 700; }
  .fallback { margin-top: 24px; padding: 12px; background: #0b0f17; border: 1px solid #1f2a3d; border-radius: 8px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; color: #8a93a6; word-break: break-all; }
  .ft { padding: 20px 32px; font-size: 12px; color: #6b7280; border-top: 1px solid #1f2a3d; }
</style>
</head>
<body>
  <!-- Edit this header per project (e.g. "ETS2 Tracker", "Deadwax Club"). -->
  <div class="wrap">
    <div class="hd">Your App</div>
    <div class="bd">
      <h1>Sign in</h1>
      <p>Click the button below to sign in to your account. The link is valid for one hour.</p>
      <p><a href="{{ .ConfirmationURL }}" class="btn">Sign in</a></p>
      <p style="font-size:13px;color:#8a93a6;margin-top:24px">Or copy and paste this URL into your browser:</p>
      <div class="fallback">{{ .ConfirmationURL }}</div>
    </div>
    <div class="ft">If you didn't request this, you can safely ignore it — nobody will get into your account.</div>
  </div>
</body>
</html>
